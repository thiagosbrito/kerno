name: CI

# Untrusted-PR safety: triggers are `pull_request` (fork PRs get no secrets and a
# read-only token) and `push` to main. Never switch to `pull_request_target` or
# `workflow_run` with checkout of PR code. No repository secrets are used here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality (lint, typecheck, test, build, bundles, docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bundles:self
      - run: pnpm test:bundles
      - run: pnpm docs:check
      - name: No generated or modified tracked files
        run: git diff --exit-code
      - name: Whitespace check against base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) BASE="$EMPTY_TREE" ;;
          esac
          git cat-file -e "$BASE^{object}" 2>/dev/null || BASE="$EMPTY_TREE"
          git diff --check "$BASE" HEAD

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Real local Supabase stack (Docker): proves the migrations, grants, PostgREST and seed work
      # together. test:db truncates tenant data, so db:reset (migrations + seed) follows it.
      - name: Start local Supabase and run database tests
        run: |
          pnpm db:start
          pnpm test:db
          pnpm db:reset
      - name: Directory integration and seeded three-store e2e
        run: |
          ANON=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2 | tr -d '"')
          SERVICE=$(pnpm exec supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2 | tr -d '"')
          echo "::add-mask::$ANON"
          echo "::add-mask::$SERVICE"
          KERNO_REQUIRE_STACK_TESTS=1 KERNO_TEST_SUPABASE_URL=http://127.0.0.1:54321 KERNO_TEST_SUPABASE_ANON_KEY="$ANON" pnpm --filter @kerno/server test
          E2E_SEEDED_STORES=1 E2E_MERCHANT_AUTH=1 E2E_SUPABASE_ANON_KEY="$ANON" E2E_SUPABASE_SERVICE_ROLE_KEY="$SERVICE" pnpm test:e2e
      # `next dev` never caches pages, so the cache-header assertions only mean something against a
      # production build (THI-67). Runs after the dev-server run; the stack is already seeded.
      - name: Three-store isolation against a production build
        run: |
          ANON=$(pnpm exec supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2 | tr -d '"')
          SERVICE=$(pnpm exec supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2 | tr -d '"')
          echo "::add-mask::$ANON"
          echo "::add-mask::$SERVICE"
          E2E_PRODUCTION_SERVER=1 E2E_SEEDED_STORES=1 E2E_SUPABASE_ANON_KEY="$ANON" E2E_SUPABASE_SERVICE_ROLE_KEY="$SERVICE" pnpm test:e2e e2e/three-store-isolation.spec.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Security (secret scan, dependency audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:secrets:self
      - run: pnpm scan:secrets
      - run: pnpm test:workflows:self
      - run: pnpm check:workflows
      - run: pnpm audit:deps
